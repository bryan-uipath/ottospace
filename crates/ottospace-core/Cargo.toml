[package]
name = "ottospace-core"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

# Pure logic only: no gpui, no macOS APIs, no I/O.
[dependencies]
serde = { version = "1", features = ["derive"] }
# Parses the settings file's text. The shell reads the file.
serde_json = "1"
