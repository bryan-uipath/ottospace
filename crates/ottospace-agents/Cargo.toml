[package]
name = "ottospace-agents"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

# Speaks to agent CLIs in their structured modes. Spawns them; no network, no async runtime.
[dependencies]
# Tool labels and stations, by the same rules as the session files.
ottospace-sessions = { path = "../ottospace-sessions" }
# `agents::is_name`: the one check of a model id that goes into argv.
ottospace-core = { path = "../ottospace-core" }
serde_json = "1"
# `killpg`: a CLI is killed with the commands and servers it started. Already in the lock file.
libc = "0.2"
