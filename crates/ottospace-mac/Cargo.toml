[package]
name = "ottospace-mac"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
# Tree reader returns the core's plain `ax::Node`.
ottospace-core = { path = "../ottospace-core" }
objc2-core-foundation = { version = "0.3", features = ["CFString", "CFDictionary", "CFNumber", "CFArray", "CFCGTypes"] }
objc2-application-services = { version = "0.3", features = ["HIServices", "AXUIElement", "AXError", "AXValue", "AXValueConstants"] }
# macos_14_0: one-off screenshots (corner radius measurement).
screencapturekit = { version = "11", features = ["macos_14_0"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "libc", "NSRunningApplication", "NSResponder", "NSEvent", "NSScreen", "NSView", "NSWindow", "NSApplication", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSGraphicsContext", "NSGraphics", "NSWorkspace", "NSPasteboard", "NSPasteboardItem", "objc2-core-graphics", "NSBezierPath", "NSColor", "NSFont", "NSStringDrawing", "NSAttributedString", "NSControl", "NSButton", "NSCell", "NSScrollView", "NSClipView", "objc2-core-foundation"] }
# The Dock icon is handed to AppKit as NSData.
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSData", "NSDictionary", "NSEnumerator", "NSError", "NSGeometry", "NSPropertyList", "NSString", "NSURL"] }
# App icons are drawn to a CGImage, then encoded as PNG. CGEvent: a test run's wheel and held-key
# events, made and never posted.
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGImage", "CGEvent", "CGEventTypes", "CGRemoteOperation", "libc"] }
