[package]
name = "ottospace"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
# The package also builds `ottospace-canary`, a test app (src/bin).
default-run = "ottospace"

[dependencies]
ottospace-sessions = { path = "../ottospace-sessions" }
ottospace-core = { path = "../ottospace-core" }
ottospace-mac = { path = "../ottospace-mac" }
# Same version gpui uses: reaches the native window.
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# runtime_shaders: compile Metal shaders at launch, so builds don't need the Metal toolchain.
gpui = { version = "0.2", features = ["runtime_shaders"] }
# macos_14_0: live stream reconfiguration (resize to pane).
screencapturekit = { version = "11", features = ["macos_14_0"] }
# Same versions gpui uses, so our pixel buffers are its `SurfaceSource` type.
core-video = "0.4"
core-foundation = "0.10"
objc2-core-foundation = { version = "0.3", features = ["CFCGTypes"] }
alacritty_terminal = "0.26"
# `wait` matches terminal text against a pattern.
regex = "1"
# The trace is written on SIGUSR1: a test's timeout.
libc = "0.2"

[dev-dependencies]
serde_json = "1"
# The app-window loop moves the pointer and turns the wheel as the user's mouse does.
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGEvent", "CGEventTypes", "libc"] }
