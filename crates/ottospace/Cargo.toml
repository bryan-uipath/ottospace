[package]
name = "ottospace"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
# The package also builds `ottospace-canary`, a test app (src/bin).
default-run = "ottospace"

[lints]
workspace = true

[dependencies]
ottospace-sessions = { path = "../ottospace-sessions" }
# Drives agent CLIs in their structured modes: the drawer's native conversation.
ottospace-agents = { path = "../ottospace-agents" }
ottospace-core = { path = "../ottospace-core" }
ottospace-mac = { path = "../ottospace-mac" }
# Same version gpui uses: reaches the native window.
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# runtime_shaders: compile Metal shaders at launch, so builds don't need the Metal toolchain.
gpui = { version = "0.2", features = ["runtime_shaders"] }
# macos_14_0: live stream reconfiguration (resize to pane).
screencapturekit = { version = "11", features = ["macos_14_0"] }
# Same versions gpui uses, so our pixel buffers are its `SurfaceSource` type.
core-video = "0.4"
core-foundation = "0.10"
objc2-core-foundation = { version = "0.3", features = ["CFCGTypes"] }
alacritty_terminal = "0.26"
# `wait` matches terminal text against a pattern.
regex = "1"
# The trace is written on SIGUSR1: a test's timeout.
libc = "0.2"
# GPUI's own errors (a display link it could not make) go to the event log. In the lock already.
log = "0.4"
# A reply's markdown parsed into blocks the drawer lays out (`markdown.rs`). MIT, pure Rust, no
# I/O; pinned. No `html` feature: nothing is ever rendered as HTML. Its deps are in the lock already.
pulldown-cmark = { version = "=0.13.6", default-features = false }
# A code file's colours from its grammar (`syntax.rs`), in the viewer. MIT, each; the runtime and
# grammars are C, built by `cc`; pinned. No `wasm` feature.
tree-sitter = "=0.27.2"
tree-sitter-rust = "=0.24.2"
tree-sitter-typescript = "=0.23.2"
tree-sitter-javascript = "=0.25.0"
tree-sitter-json = "=0.24.8"
tree-sitter-toml-ng = "=0.7.0"
tree-sitter-python = "=0.25.0"
tree-sitter-bash = "=0.25.1"
tree-sitter-go = "=0.25.0"
tree-sitter-c = "=0.24.2"
tree-sitter-cpp = "=0.23.4"
tree-sitter-java = "=0.23.5"
tree-sitter-c-sharp = "=0.23.5"
tree-sitter-ruby = "=0.23.1"
tree-sitter-html = "=0.23.2"
tree-sitter-css = "=0.25.0"
tree-sitter-yaml = "=0.7.2"
tree-sitter-sequel = "=0.3.13"
tree-sitter-php = "=0.25.1"
tree-sitter-lua = "=0.5.0"
tree-sitter-make = "=1.1.1"
tree-sitter-xml = "=0.7.0"
tree-sitter-md = "=0.5.4"
# The code city drawn offscreen (`city_gpu.rs`): the platform's own backends, WGSL shaders. MIT OR Apache-2.0.
wgpu = { version = "30", default-features = false, features = ["std", "wgsl", "metal", "vulkan", "dx12", "gles"] }
# A rendered picture as GPUI's image (`RenderImage`): same version gpui uses, in the lock already.
image = { version = "0.25", default-features = false }
pollster = "0.4"
# The city rendered straight into an IOSurface GPUI paints (`city_gpu::Picture::surface`): wgpu's
# own Metal types (same versions as wgpu-hal), no read back.
objc2-metal = { version = "0.3", default-features = false, features = ["std", "MTLDevice", "MTLTexture", "MTLResource", "MTLPixelFormat", "MTLTypes", "objc2-io-surface"] }
objc2-io-surface = { version = "0.3", default-features = false, features = ["std", "IOSurfaceRef", "objc2"] }

[dev-dependencies]
serde_json = "1"
# The app-window loop moves the pointer and turns the wheel as the user's mouse does.
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGEvent", "CGEventTypes", "libc"] }
