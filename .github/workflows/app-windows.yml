name: App windows

# `cargo e2e-apps`: real windows of the canary app, hosted, entered, dragged. It needs
# Accessibility and Screen Recording for the process that starts ottospace, which the hosted
# macOS image grants to bash, and a window server. Run here so nobody's keyboard is taken.
# Not a required check: a pointer test can still be flaky.
on:
  workflow_dispatch:
  pull_request:
    # Text nobody compiles: no macOS runner for it.
    paths-ignore: ['docs/**', 'site/**', 'README.md', 'AGENTS.md', 'CLAUDE.md', 'LICENSE']
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'site/**', 'README.md', 'AGENTS.md', 'CLAUDE.md', 'LICENSE']

permissions:
  contents: read

concurrency:
  group: app-windows-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  e2e-apps:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # What the runner image grants, read-only: which programs may use Accessibility and
      # Screen Recording. Tells us why the run below passes or fails.
      - name: Permissions the runner has
        run: |
          for db in "/Library/Application Support/com.apple.TCC/TCC.db" "$HOME/Library/Application Support/com.apple.TCC/TCC.db"; do
            echo "== $db"
            sudo sqlite3 "$db" "select service, client, auth_value from access where service in ('kTCCServiceAccessibility','kTCCServiceScreenCapture','kTCCServiceAppleEvents','kTCCServicePostEvent','kTCCServiceListenEvent') order by 1,2" 2>&1 | head -60 || true
          done
          echo "parent chain:"; ps -o pid,ppid,comm -p $$ -p $PPID || true
      # The tests post a few real pointer events with cliclick.
      - name: cliclick
        run: command -v cliclick || HOMEBREW_NO_AUTO_UPDATE=1 brew install cliclick
      - name: App-window tests
        run: cargo e2e-apps
