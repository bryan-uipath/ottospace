name: Dependencies

# cargo audit (known advisories) and cargo deny (advisories, licences, bans, sources) over the
# dependency graph. Linux, no build: both read Cargo.lock and `cargo metadata` only. Weekly on
# main too, so an advisory published since the last change shows.
on:
  pull_request:
    paths:
      - 'Cargo.lock'
      - '**/Cargo.toml'
      - 'deny.toml'
      - '.github/workflows/deps.yml'
  schedule:
    - cron: '17 5 * * 1'

# pull_request, never pull_request_target: a fork's run gets a read-only token and no secrets.
permissions:
  contents: read

concurrency:
  group: deps-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Pinned with its checksum by install-action's manifest.
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-audit@0.22.2
      # Fails on a vulnerability anywhere in Cargo.lock, any target. Unmaintained crates only warn
      # here: cargo deny fails on them, for the macOS graph, with dated ignores in deny.toml.
      - name: cargo audit
        run: cargo audit

  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          cargo --version
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-deny@0.20.2
      # deny.toml: the macOS graph (`targets`), though it runs on Linux.
      - name: cargo deny
        run: cargo deny --locked check
