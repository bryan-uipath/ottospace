name: CI

on:
  pull_request:
    # Text nobody compiles: no macOS runner for it. (`crates/**/*.md` is compiled in: not listed.)
    paths-ignore: ['docs/**', 'site/**', 'README.md', 'AGENTS.md', 'CLAUDE.md', 'LICENSE']
  push:
    branches: [main]
    # Text nobody compiles: no macOS runner for it. (`crates/**/*.md` is compiled in: not listed.)
    paths-ignore: ['docs/**', 'site/**', 'README.md', 'AGENTS.md', 'CLAUDE.md', 'LICENSE']

permissions:
  contents: read

# A new push to the same PR or branch cancels the run it supersedes.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    # Apple Silicon. The build links macOS frameworks (ScreenCaptureKit, AppKit).
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          rustc --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # ottospace-mac is not rustfmt-clean yet, so check only the crates that are.
      - name: Format
        run: cargo fmt -p ottospace -p ottospace-core -p ottospace-sessions -p ottospace-agents --check
      # Fails on errors only: main still has clippy warnings.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked
      - name: Unit tests
        run: cargo test --workspace --locked
      # The SDK without the app: its types, and that it has a method for every request.
      # Node, not bun: Node 22.18+ runs TypeScript as it is, and setup-node is GitHub's own action.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: SDK types and request fixture
        working-directory: sdk
        run: |
          npm ci --ignore-scripts
          npm run typecheck
          node --test test/requests.test.ts test/parse.test.ts test/socket.test.ts

  e2e:
    # Needs a window server, which a hosted runner may lack, so it does not block.
    runs-on: macos-26
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Hosting off. Never cargo e2e-apps here: it needs Accessibility and Screen Recording.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-nextest@0.9.149
      # `cargo e2e` under nextest (`.config/nextest.toml`): each test in its own process, one at a
      # time, up to three tries. One that passes on a retry is flaky: the summary says so.
      - name: E2E
        env:
          OTTOSPACE_E2E_OUT: ${{ runner.temp }}/e2e
        run: cargo nextest run -p ottospace --test e2e --run-ignored only --profile e2e --locked
      - name: E2E summary
        if: ${{ !cancelled() }}
        env:
          OUT: ${{ runner.temp }}/e2e
        run: |
          mkdir -p "$OUT"
          cp target/nextest/e2e/junit.xml "$OUT/" || true
          python3 -I scripts/e2e-report "$OUT" --markdown "$OUT/summary.md" || true
          cat "$OUT/summary.md" >> "$GITHUB_STEP_SUMMARY"
      # Each failed attempt's folder: state, timeline, trace, stack sample, screenshot.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: e2e-failures
          path: ${{ runner.temp }}/e2e/failures
          if-no-files-found: ignore
          retention-days: 14
      # The TypeScript client against a private instance, as cargo e2e runs one: hosting off, its
      # own socket, no user folder. No npm install: the SDK has no runtime dependencies.
      - name: SDK tests
        if: ${{ !cancelled() }}
        working-directory: sdk
        run: |
          cargo build -p ottospace --locked
          npm test
