name: CI

# Pull requests and the merge queue: Linux only (`check`), no macOS runner. Pushes to main: also
# the one macOS job (macos.yml: every suite), and an issue "main is red" while it fails. A pull
# request gets a macOS run only by label (e2e.yml).
on:
  pull_request:
    # Text nobody compiles: no runner for it. (`crates/**/*.md` is compiled in: not listed.)
    paths-ignore: ['docs/**', 'site/**', 'README.md', 'AGENTS.md', 'CLAUDE.md', 'LICENSE']
  # The merge queue's commit. No path filter: the queue tests every pull request.
  merge_group:
  push:
    branches: [main]
    # Text nobody compiles: no runner for it. (`crates/**/*.md` is compiled in: not listed.)
    paths-ignore: ['docs/**', 'site/**', 'README.md', 'AGENTS.md', 'CLAUDE.md', 'LICENSE']

permissions:
  contents: read

# A new push to the same PR or branch cancels the run it supersedes: a burst of merges tests main's
# newest tip. A merge group's ref (`gh-readonly-queue/main/pr-<n>-<sha>`) is its own: groups never
# cancel each other. A re-run of a push to main is its own group: one of an older push must not
# cancel the newest run, whose `main-red` speaks for main.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}${{ github.event_name == 'push' && github.run_attempt > 1 && format('-rerun-{0}', github.run_id) || '' }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    # Linux: everything that needs no Mac. ottospace-mac and the shell compile only on macOS (their
    # build scripts run Swift; GPUI's needs Apple's SDK): macos.yml checks them.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy --target aarch64-apple-darwin
          rustup default stable
          rustc --version
      # Linux's own cache, apart from macOS's `e2e` one. A merge group's ref is gone once it
      # merges: its cache would only fill the quota.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.event_name != 'merge_group' }}
      # rustfmt needs no build: the shell is checked here too. ottospace-mac is not rustfmt-clean yet.
      - name: Format
        run: cargo fmt -p ottospace -p ottospace-core -p ottospace-sessions -p ottospace-agents --check
      # Fails on errors and unused code (`-D unused`); other clippy warnings do not fail. A library's
      # `pub` in a private module fails: as `pub(crate)` the dead-code check sees it.
      - name: Clippy
        run: >-
          cargo clippy -p ottospace-core -p ottospace-sessions -p ottospace-agents --all-targets --locked
          -- -D unused -D unreachable_pub
      # The same crates as macOS compiles them (its `cfg`s, its libc), without linking: no Apple SDK.
      - name: Clippy for macOS
        run: >-
          cargo clippy -p ottospace-core -p ottospace-sessions -p ottospace-agents --all-targets --locked
          --target aarch64-apple-darwin -- -D unused -D unreachable_pub
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-machete@0.9.2
      # A dependency no source names fails: reads source only, every crate. False positives:
      # `[package.metadata.cargo-machete]`.
      - name: Unused dependencies
        run: cargo machete --with-metadata
      # The pure crates. The shell's and ottospace-mac's tests run in macos.yml.
      - name: Unit tests
        run: cargo test -p ottospace-core -p ottospace-sessions -p ottospace-agents --locked
      # The SDK without the app: its types, and that it has a method for every request.
      # Node, not bun: Node 22.18+ runs TypeScript as it is, and setup-node is GitHub's own action.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: SDK types and request fixture
        working-directory: sdk
        run: |
          npm ci --ignore-scripts
          npm run typecheck
          node --test test/requests.test.ts test/parse.test.ts test/socket.test.ts

  # Main only: every suite on macOS. Not after `check`: main's macOS result is wanted even when
  # its formatting fails, and the queue for a Mac is the long wait.
  macos:
    if: ${{ github.event_name == 'push' }}
    uses: ./.github/workflows/macos.yml
    permissions:
      contents: read

  # One issue, "main is red": opened or updated while main's `check` or macOS job fails, with the
  # failed tests and the commits since the last green run; closed when both pass again.
  main-red:
    needs: [check, macos]
    # `!cancelled()`: without a status function the job is skipped when a job it needs fails.
    if: ${{ !cancelled() && github.event_name == 'push' && contains(fromJSON('["success","failure"]'), needs.macos.result) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      # History for the range; nothing from the checkout is run.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Open, update or close "main is red"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CHECK: ${{ needs.check.result }}
          RESULT: ${{ needs.macos.result }}
          FAILED: ${{ needs.macos.outputs.failed }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # A re-run of an older push must not speak for main: only the newest run does.
          newest="$(gh run list --workflow ci.yml --branch main --event push --limit 1 --json databaseId --jq '.[0].databaseId')"
          if [ "$newest" != "$GITHUB_RUN_ID" ]; then echo "a newer run ($newest) speaks for main"; exit 0; fi
          # macOS failed with no suite named: a timeout, or a step outside the suites.
          [ "$RESULT" = success ] || [ -n "$FAILED" ] || FAILED="macOS: $RESULT, no suite named: see the run"
          [ "$CHECK" = success ] || FAILED="$(printf 'check (Linux): %s\n%s' "$CHECK" "$FAILED")"
          # Only an issue this job wrote: anyone can open one with the title, or thirty (the
          # search asks for the author too, so theirs cannot fill the page). gh names the
          # token's author `app/github-actions` (older ones `github-actions[bot]`): no user's login.
          mine='[.[] | select(.title == "main is red" and (.author.login == "app/github-actions" or .author.login == "github-actions[bot]"))][0].number // empty'
          number="$(gh issue list --state open --search 'in:title "main is red" author:app/github-actions' --json number,title,author --jq "$mine")"
          if [ "$RESULT" = success ] && [ "$CHECK" = success ]; then
            if [ -n "$number" ]; then gh issue close "$number" --comment "Green again at $GITHUB_SHA: $RUN_URL"; fi
            exit 0
          fi
          last="$(gh run list --workflow ci.yml --branch main --event push --status success --limit 1 \
            --json headSha --jq '.[0].headSha // empty')"
          if [ -n "$last" ] && git cat-file -e "$last^{commit}" 2>/dev/null; then
            range="$(git log --oneline "$last..HEAD")"
          else
            last="none found"; range="$(git log --oneline -1)"
          fi
          body="$(mktemp)"
          {
            echo "main failed at $GITHUB_SHA: [run]($RUN_URL). Each failed e2e test's folder is in its artifacts."
            echo
            echo "### Failed"
            echo '```'
            echo "${FAILED:-see the run}"
            echo '```'
            echo
            echo "### Commits since the last green run ($last)"
            echo '```'
            echo "$range"
            echo '```'
          } > "$body"
          { echo "## main is red"; echo; cat "$body"; } >> "$GITHUB_STEP_SUMMARY"
          # Red again: the closed issue is opened again, so there is one issue, not one per flip.
          if [ -z "$number" ]; then
            number="$(gh issue list --state closed --search 'in:title "main is red" author:app/github-actions sort:updated-desc' --json number,title,author --jq "$mine")"
            [ -z "$number" ] || gh issue reopen "$number"
          fi
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file "$body"
          else
            gh issue create --title "main is red" --body-file "$body"
          fi
