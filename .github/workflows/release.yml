name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No build cache: a release builds from scratch, not from cache entries other runs wrote.
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
      # Tag vX.Y.Z must match the version bundle.sh stamps into Info.plist.
      - name: Check version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(cargo pkgid -p ottospace)"
          version="${version##*[#@]}"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match crate version $version. Bump the version in Cargo.toml or tag v$version."
            exit 1
          fi
      # The same files a build of main publishes: binary, app, BUILD, SHA256SUMS.
      - name: Package
        env:
          OTTOSPACE_COMMIT: ${{ github.sha }}
        run: scripts/package.sh dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "$TAG" --verify-tag --generate-notes
