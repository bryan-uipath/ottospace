[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

# Unused code warns here and fails CI, which runs clippy with `-D unused`: a half-written
# function does not stop `cargo test`. Each crate opts in with `[lints] workspace = true`.
[workspace.lints.rust]
unused = { level = "warn", priority = -1 }

# gpui 0.2.2 with one patch: alpha blends "over", not added up, so translucent quads stay
# translucent over the code city's live layer. https://github.com/bryan-uipath/gpui, branch blend-over.
[patch.crates-io]
gpui = { git = "https://github.com/bryan-uipath/gpui", rev = "823ca2aa011642e072fac49794a274d5c6b562de" }

# Smaller build folders: several worktrees build at once. Line numbers in backtraces stay for
# our crates; dependencies carry no debug info.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
