[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

# Unused code warns here and fails CI, which runs clippy with `-D unused`: a half-written
# function does not stop `cargo test`. Each crate opts in with `[lints] workspace = true`.
[workspace.lints.rust]
unused = { level = "warn", priority = -1 }

# gpui 0.2.2 with patches: a CoreText font kept per size (from gpui-fast).
# https://github.com/bryan-uipath/gpui, a fork of zed-industries/zed@69e21302 crates/gpui.
[patch.crates-io]
gpui = { git = "https://github.com/bryan-uipath/gpui", rev = "0a74b7a1f8e377e7270d3a958a40ab9c9048bab3" }

# Smaller build folders: several worktrees build at once. Line numbers in backtraces stay for
# our crates; dependencies carry no debug info.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
