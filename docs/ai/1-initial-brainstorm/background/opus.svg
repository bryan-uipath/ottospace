    <!-- propeller motion arcs (from the logo's swoosh shapes, simplified to strokes) -->
    <path id="whirl" d="M47 20C60 13 72 14 90 16.6M37 16.5C58 5 80 6 100.8 12.2M25.5 12.6C55 -6 85 -3 112 7.7M19 28C26 40 35 43 44.3 44M32 28C38 34.5 44 37 49.8 38.2M44 28.2C47 31.5 50 33 54.6 33.2M130.7 31.2C124 39 113 44 100 47.2M116.4 31C108 39 98 41 85.8 41.4M101.7 30.4C95 35 88 36 79.4 35.7"/>
  </defs>

  <!-- base, dot grid, focal glow -->
  <rect width="1440" height="900" fill="#09090b"/>
  <rect width="1440" height="900" fill="url(#dots)" mask="url(#gridMask)"/>
  <rect width="1440" height="900" fill="url(#glow)"/>

  <!-- blueprint construction: concentric orbits + crosshair through Otto's body centre (710, 508) -->
  <g fill="none" stroke="#27272a" stroke-width="1">
    <circle cx="710" cy="508" r="300" stroke-dasharray="2 8"/>
    <circle cx="710" cy="508" r="360" stroke-opacity="0.6"/>
    <path d="M300 508H1120M710 110V860" stroke-dasharray="4 10"/>
    <path d="M690 508h40M710 488v40" stroke="#3f3f46"/>
  </g>
  <!-- small tick marks on the outer orbit, like a dial -->
  <g stroke="#3f3f46" stroke-width="1">
    <path d="M710 148v10M710 858v10M350 508h10M1060 508h10"/>
    <path d="M455.4 253.4l7 7M964.6 253.4l-7 7M455.4 762.6l7-7M964.6 762.6l-7-7"/>
  </g>

  <!-- node-graph callouts: thin leaders from features to small nodes -->
  <g fill="none" stroke="#3f3f46" stroke-width="1">
    <path d="M916 249L1010 196H1110"/>
    <path d="M524 520L410 590H330"/>
    <path d="M962 540L1050 600H1150"/>
  </g>
  <g fill="#09090b" stroke="#52525c" stroke-width="1">
    <circle cx="1110" cy="196" r="4"/>
    <circle cx="330" cy="590" r="4"/>
    <circle cx="1150" cy="600" r="4"/>
  </g>
  <g fill="#52525c">
    <rect x="1124" y="193" width="44" height="2" rx="1" opacity="0.6"/>
    <rect x="1124" y="199" width="28" height="2" rx="1" opacity="0.4"/>
    <rect x="272" y="587" width="44" height="2" rx="1" opacity="0.6"/>
    <rect x="288" y="593" width="28" height="2" rx="1" opacity="0.4"/>
    <rect x="1164" y="597" width="36" height="2" rx="1" opacity="0.6"/>
  </g>

  <!-- Otto, logo scaled 3.2x and centred; strokes in logo units (0.35 = ~1.1px) -->
  <g transform="translate(473.6 211.6) scale(3.2)" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <!-- faint luminous halo around the body -->
    <use xlink:href="#body" stroke="#00b8db" stroke-width="2" stroke-opacity="0.18" filter="url(#soft)"/>
    <!-- body: faint fill so it reads as one solid disc -->
    <use xlink:href="#body" fill="#083344" fill-opacity="0.35" stroke="#00b8db" stroke-width="0.4" stroke-opacity="0.75"/>
    <use xlink:href="#rim" fill="#083344" fill-opacity="0.2" stroke="#00b8db" stroke-width="0.3" stroke-opacity="0.45"/>
    <use xlink:href="#rimL" stroke="#00b8db" stroke-width="0.3" stroke-opacity="0.35"/>
    <use xlink:href="#cap" fill="#083344" fill-opacity="0.4" stroke="#53eafd" stroke-width="0.35" stroke-opacity="0.6"/>
    <use xlink:href="#visor" stroke="#53eafd" stroke-width="0.3" stroke-opacity="0.45"/>
    <!-- propeller and motion arcs in warm accent, like the original's gold -->
    <use xlink:href="#blade" fill="#ff8904" fill-opacity="0.08" stroke="#ff8904" stroke-width="0.35" stroke-opacity="0.65"/>
    <use xlink:href="#whirl" stroke="#ff8904" stroke-width="0.3" stroke-opacity="0.28" stroke-dasharray="1.2 1.4"/>
    <!-- eyes: the brightest part, so the face reads first -->
    <use xlink:href="#eyeL" fill="#fafafa" fill-opacity="0.07" stroke="#53eafd" stroke-width="0.45" stroke-opacity="0.9"/>
    <use xlink:href="#eyeR" fill="#fafafa" fill-opacity="0.07" stroke="#53eafd" stroke-width="0.45" stroke-opacity="0.9"/>
    <use xlink:href="#pupilL" fill="#00b8db" fill-opacity="0.55"/>
    <use xlink:href="#pupilR" fill="#00b8db" fill-opacity="0.55"/>
    <use xlink:href="#smile" fill="#53eafd" fill-opacity="0.5" stroke="#53eafd" stroke-width="0.3" stroke-opacity="0.6"/>
    <!-- waving arms in the alt pink -->
    <use xlink:href="#armR" stroke="#ff8484" stroke-width="0.35" stroke-opacity="0.55"/>
    <use xlink:href="#handR" fill="#3b1d1d" fill-opacity="0.5" stroke="#ff8484" stroke-width="0.35" stroke-opacity="0.55"/>
    <use xlink:href="#armL" stroke="#ff8484" stroke-width="0.35" stroke-opacity="0.55"/>
    <use xlink:href="#handL" fill="#3b1d1d" fill-opacity="0.5" stroke="#ff8484" stroke-width="0.35" stroke-opacity="0.55"/>
  </g>
</svg>
