    <path id="armL" d="M11.2097 139.481C13.0764 136.242 16.7071 128.592 24.9237 125.017C26.4606 124.345 25.6672 124.734 26.9055 124.289C27.2206 125.026 27.3436 125.838 27.263 126.643C26.983 128.876 26.3141 129.091 24.5189 129.81C19.3109 131.894 15.7828 137.563 14.4512 140.861C13.1197 144.158 10.4596 145.954 7.06226 143.745C3.83314 141.575 3.15801 136.977 7.56652 130.334C9.49543 127.425 12.311 125.17 15.2448 123.337C17.2547 122.084 19.56 120.64 21.9463 120.123C22.279 120.076 22.6151 120.056 22.9512 120.064C24.1179 120.388 24.2796 120.867 25.4868 122.111C26.0952 122.74 26.5769 123.479 26.9055 124.289"/>
