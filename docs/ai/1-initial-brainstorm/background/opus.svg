<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1440 900" width="1440" height="900">
  <!-- ottospace background: Otto drawn as a blueprint wireframe on a dot grid -->
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1" fill="#27272a"/>
    </pattern>
    <!-- focal glow behind the mark -->
    <radialGradient id="glow" cx="710" cy="470" r="380" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#083344" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#083344" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#083344" stop-opacity="0"/>
    </radialGradient>
    <!-- grid fades out toward the edges -->
    <radialGradient id="fade" cx="720" cy="450" r="820" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.25"/>
    </radialGradient>
    <mask id="gridMask"><rect width="1440" height="900" fill="url(#fade)"/></mask>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>

    <!-- Logo silhouettes, reused from otto-blue.svg (154x154 units) -->
